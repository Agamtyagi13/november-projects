# /etc/health-monitor/health-monitor.conf  — all values are optional (defaults shown)
CPU_WARN=80            # % CPU busy (1s sample)
MEM_WARN=85            # % memory used (excludes cache)
DISK_WARN=90           # % disk used
DISK_PATHS="/"         # space-separated mount points, e.g. "/ /var /data"
SERVICES="ssh nginx"   # space-separated systemd units (falls back to process name)

LOG_FILE=/var/log/health-monitor.log
ALERT_COOLDOWN=1800    # seconds between repeat alerts for the same problem

# Alert channels (use any/all)
WEBHOOK_URL=""         # Slack/Discord/Teams incoming-webhook URL
WEBHOOK_FORMAT=slack   # slack | discord
ALERT_EMAIL=""         # requires `mail` (mailutils/bsd-mailx)
ALERT_CMD=""           # any command that reads the message on stdin, e.g. 'logger -t health-monitor'
DRY_RUN=0              # 1 = log alerts but do not send
