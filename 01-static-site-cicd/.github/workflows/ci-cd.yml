name: ci-cd
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or tag to deploy (use this to roll back)"
        required: false

permissions: { contents: read }
concurrency: { group: pages, cancel-in-progress: false }

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - name: Lint HTML
        run: npx --yes htmlhint@1.1.4 "site/*.html"
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile }
      - name: Build image
        run: docker build -t site:test .
      - name: Run container and smoke test
        run: |
          docker run -d --name site -p 8080:8080 site:test
          for i in $(seq 1 15); do curl -fs localhost:8080/healthz && break || sleep 1; done
          ./scripts/smoke-test.sh http://localhost:8080
      - name: Container logs on failure
        if: failure()
        run: docker logs site

  deploy-pages:
    needs: validate
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - name: Stamp build id
        run: sed -i "s#<span id=\"build\">local</span>#<span id=\"build\">${GITHUB_SHA::7}</span>#" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4

  publish-image:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
